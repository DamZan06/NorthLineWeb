name: Temporary Firebase point filter

on:
  push:
    paths:
      - '.github/workflows/tmp-filter-cabbiolo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and filter Firebase points
        run: |
          node <<'NODE'
          const fs = require('fs');
          const url = 'https://northline-a4eaa-default-rtdb.europe-west1.firebasedatabase.app/livetrack/points.json';
          const cutoff = Date.parse('2026-09-04T19:00:00+02:00');
          const centers = [
            {name:'Cabbiolo', lat:46.3282, lon:9.20494},
            {name:'Lostallo', lat:46.314, lon:9.198}
          ];
          const radiusKm = 4.0;
          const R = 6371.0088;
          const rad = d => d*Math.PI/180;
          const dist = (a,b) => {
            const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
            const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(h));
          };
          const tsOf = p => {
            const v = p?.timestamp ?? p?.time ?? p?.orario ?? p?.createdAt ?? p?.updatedAt;
            if (v == null) return NaN;
            if (typeof v === 'number') return v < 1e12 ? v*1000 : v;
            const n = Number(v);
            if (Number.isFinite(n)) return n < 1e12 ? n*1000 : n;
            return Date.parse(v);
          };
          const coord = p => ({
            lat:Number(p?.latitude ?? p?.lat ?? p?.y ?? p?.coordinate?.lat ?? p?.coordinates?.lat ?? p?.location?.latitude ?? p?.location?.lat),
            lon:Number(p?.longitude ?? p?.lng ?? p?.lon ?? p?.x ?? p?.coordinate?.lon ?? p?.coordinate?.lng ?? p?.coordinates?.lon ?? p?.location?.longitude ?? p?.location?.lng)
          });
          (async()=>{
            const r=await fetch(url,{headers:{accept:'application/json'}});
            if(!r.ok) throw new Error(`Firebase ${r.status}`);
            const data=await r.json();
            const raw = Array.isArray(data) ? data.map((v,i)=>[String(i),v]) : Object.entries(data||{});
            const out=[];
            for(const [id,p] of raw){
              if(!p || typeof p!=='object') continue;
              const t=tsOf(p); if(!Number.isFinite(t)||t<cutoff) continue;
              const c=coord(p); if(!Number.isFinite(c.lat)||!Number.isFinite(c.lon)) continue;
              const ds=centers.map(x=>({name:x.name,km:dist(c,{lat:x.lat,lon:x.lon})})).sort((a,b)=>a.km-b.km);
              if(ds[0].km>radiusKm) continue;
              out.push({id,timestamp:t,timeZurich:new Intl.DateTimeFormat('it-CH',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t)),latitude:c.lat,longitude:c.lon,nearest:ds[0].name,distanceKm:Number(ds[0].km.toFixed(3)),altitude:p.altitude ?? p.elevation ?? p.altitudine?.metri ?? null,speed:p.speed ?? p.velocita?.km_h ?? p.velocita?.kmh ?? null,heartRate:p.heartRate ?? p.hr ?? p.frequenza_cardiaca?.bpm ?? null,raw:p});
            }
            out.sort((a,b)=>a.timestamp-b.timestamp);
            fs.mkdirSync('tmp',{recursive:true});
            fs.writeFileSync('tmp/firebase-cabbiolo-lostallo.json',JSON.stringify({cutoffZurich:'2026-09-04 19:00:00',radiusKm,centers,count:out.length,points:out},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/firebase-cabbiolo-lostallo.json
          git commit -m "chore: save temporary Firebase filter result" || exit 0
          git push origin HEAD:main
